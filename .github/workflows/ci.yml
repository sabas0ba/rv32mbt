name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build toolchain image
        run: docker build -t rv32mbt-dev .

      - name: Run regression suite
        run: docker run --rm -v "$PWD:/work" rv32mbt-dev bash ci/run.sh

      - name: Build release artifacts
        run: docker run --rm -v "$PWD:/work" rv32mbt-dev bash ci/build_dist.sh

      # actions/upload-artifact v4.6.2
      - name: Upload native CLI (linux x86_64)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rv32mbt-linux-x86_64
          path: _build/dist/rv32mbt-linux-x86_64

      - name: Upload wasm VM module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rv32mbt-vm-wasm
          path: _build/dist/rv32mbt-vm.wasm

      - name: Upload web site bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rv32mbt-site
          path: _build/dist/site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/cache v4.2.3 — reuse the built kernel while linux/ is
      # unchanged (the tarball fetch is sha256-pinned, so a hit is
      # reproducible)
      - name: Cache kernel artifacts
        id: kernel-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            _build/kernel/vmlinux
            _build/kernel/rv32mbt.dtb
          key: kernel-${{ hashFiles('linux/**') }}

      - name: Build kernel (cache miss)
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          docker build -t rv32mbt-linux -f linux/Dockerfile linux
          docker run --rm -v "$PWD:/work" rv32mbt-linux bash linux/build.sh

      - name: Build toolchain image
        run: docker build -t rv32mbt-dev .

      - name: Assemble site
        run: docker run --rm -v "$PWD:/work" rv32mbt-dev bash ci/build_site.sh

      # actions/configure-pages v5.0.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      # actions/upload-pages-artifact v3.0.1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _build/site

      # actions/deploy-pages v4.0.5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
