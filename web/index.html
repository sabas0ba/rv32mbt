<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>rv32mbt — RV32 emulator (MoonBit)</title>
<style>
  body { font-family: sans-serif; margin: 1rem; background: #1e1e1e; color: #ddd; }
  #term {
    font-family: monospace; white-space: pre-wrap; word-break: break-all;
    background: #000; color: #cfc; padding: 8px; height: 24em;
    overflow-y: scroll; border: 1px solid #444; outline: none;
  }
  #status { margin-top: 0.5rem; color: #aaa; }
  button, input { font-size: 1rem; }
</style>
</head>
<body>
<h1>rv32mbt</h1>
<p>
  RV32IMA / QEMU-virt互換メモリマップ / UART 16550。
  ELF (rv32) または flat binary (0x80000000 ロード) を選択して実行。
</p>
<div>
  <input type="file" id="file">
  <label><input type="checkbox" id="isbin"> flat binary</label>
  <button id="run" disabled>Run</button>
  <button id="stop" disabled>Stop</button>
</div>
<div id="term" tabindex="0"></div>
<div id="status">idle</div>
<script type="module">
import * as emu from "./js/release/build/web/web.js";

const term = document.getElementById("term");
const status = document.getElementById("status");
const runBtn = document.getElementById("run");
const stopBtn = document.getElementById("stop");
const fileInput = document.getElementById("file");
const isbin = document.getElementById("isbin");

let image = null;
let timer = null;
let steps = 0;
const decoder = new TextDecoder("utf-8", { fatal: false });

fileInput.addEventListener("change", async () => {
  const f = fileInput.files[0];
  if (!f) return;
  image = new Uint8Array(await f.arrayBuffer());
  runBtn.disabled = false;
  status.textContent = `loaded: ${f.name} (${image.length} bytes)`;
});

function flushOutput() {
  const out = emu.vm_take_output();
  if (out.length > 0) {
    term.textContent += decoder.decode(out);
    term.scrollTop = term.scrollHeight;
  }
}

function tick() {
  steps += emu.vm_run(2_000_000);
  flushOutput();
  if (emu.vm_halted()) {
    stop(`halted, exit=${emu.vm_exit_code()}, steps=${steps}`);
    return;
  }
  status.textContent = `running, steps=${steps}, pc=0x${emu.vm_pc().toString(16)}`;
}

function stop(msg) {
  if (timer !== null) { clearInterval(timer); timer = null; }
  stopBtn.disabled = true;
  runBtn.disabled = image === null;
  if (msg) status.textContent = msg;
}

runBtn.addEventListener("click", () => {
  term.textContent = "";
  steps = 0;
  emu.vm_create(128);
  if (isbin.checked) {
    emu.vm_load_bin(image);
  } else {
    const entry = emu.vm_load_elf(image);
    if (entry < 0) { status.textContent = "ELF parse error"; return; }
  }
  runBtn.disabled = true;
  stopBtn.disabled = false;
  term.focus();
  timer = setInterval(tick, 10);
});

stopBtn.addEventListener("click", () => stop("stopped"));

term.addEventListener("keydown", (ev) => {
  if (timer === null) return;
  let bytes = null;
  if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey) {
    bytes = new TextEncoder().encode(ev.key);
  } else if (ev.key === "Enter") {
    bytes = Uint8Array.of(13);
  } else if (ev.key === "Backspace") {
    bytes = Uint8Array.of(127);
  } else if (ev.key === "Tab") {
    bytes = Uint8Array.of(9);
  } else if (ev.ctrlKey && ev.key.length === 1) {
    const c = ev.key.toUpperCase().charCodeAt(0);
    if (c >= 64 && c < 96) bytes = Uint8Array.of(c - 64);
  }
  if (bytes) {
    for (const b of bytes) emu.vm_push_input(b);
    ev.preventDefault();
  }
});
</script>
</body>
</html>
